name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Run non-device tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Audit release artifacts
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$wheel"
          test -n "$sdist"
          uv run python scripts/release_audit.py \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --provenance provenance.toml

      - name: Install wheel in a clean environment
        run: |
          smoke_env="$(mktemp -d)"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check --no-input \
            dist/*.whl
          "$smoke_env/bin/python" scripts/stdio_smoke.py \
            --command "$smoke_env/bin/mobile-use-mcp"

      - name: Inspect MCP tool schema
        run: >-
          npx -y @modelcontextprotocol/inspector --cli
          uv --directory "$GITHUB_WORKSPACE" run mobile-use-mcp
          --method tools/list
